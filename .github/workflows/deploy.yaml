name: Deploy to ec2

on: 
    push: 
        branches: 
            - main

jobs: 
    deploy: 
        runs-on: ubuntu-latest

        steps: 
          - name: SSH deploy
            uses: appleboy/ssh-action@v1.0.3
            with: 
                host: ${{secrets.HOST}}
                username: ubuntu
                key: ${{secrets.SSH_KEY}}
                script: |
                    cd /var/www/gitmate
                    sudo git pull 
                    sudo pnpm install --frozen-lockfile
                    sudo pnpm build 
                    sudo pm2 restart gitmate
